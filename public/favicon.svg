  </text>

  <!-- Charming 4-Point Sparkle Star Accent -->
  <path
    d="M47 15C47 19.5 49.5 22 54 22C49.5 22 47 24.5 47 29C47 24.5 44.5 22 40 22C44.5 22 47 19.5 47 15Z"
